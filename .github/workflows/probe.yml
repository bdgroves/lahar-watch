name: Probe
on:
  workflow_dispatch:
    inputs:
      script:
        description: script to run
        default: tools/probe.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests obspy
      - run: python ${{ inputs.script || 'tools/probe.py' }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp tools/probe_out.json /tmp/probe_out.json
          git reset -q --hard && git clean -fdq
          git checkout --orphan probe-out
          git rm -rq --cached .
          mkdir -p tools && cp /tmp/probe_out.json tools/probe_out.json
          git add -f tools/probe_out.json
          git commit -qm "probe output"
          git push -f origin probe-out
