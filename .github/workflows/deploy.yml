name: Fetch Sensor Data & Deploy

# Hourly at :17 (GitHub drops many runs scheduled on the hour). Data no longer goes into main's
# history: the latest files, including the 7-day RSAM history, live on the `data` branch, which is
# overwritten each run, and the site is deployed straight from the workspace.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "*.html"
      - "data/hazard_zones.geojson"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the last run's data (RSAM history)
        run: |
          git fetch --depth=1 origin data && git checkout origin/data -- data || echo "no data branch yet"
          git reset -q   # keep the restored files out of main's index

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - run: pip install -r requirements.txt

      - name: Fetch sensor data
        run: |
          python scripts/fetch_sensors.py > fetch.log 2>&1 || { cat fetch.log; echo "::error title=fetch_sensors::$(tail -20 fetch.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          cat fetch.log

      - name: Validate data
        run: |
          python scripts/validate_data.py > validate.log 2>&1 || { cat validate.log; echo "::error title=validate::$(tail -20 validate.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          cat validate.log

      - name: Save data to the data branch (overwritten each run)
        run: |
          mkdir -p /tmp/out && cp -r data /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "lahar-watch-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -qm "data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
