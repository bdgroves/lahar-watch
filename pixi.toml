[workspace]
name = "lahar-watch"
description = "Washington State LAHAR Sensor Network — Dashboard & Data Pipeline"
version = "0.1.0"
authors = ["bdgroves"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
requests = ">=2.31"
obspy = ">=1.4"

[feature.dev.dependencies]
pytest = ">=7.4"
ruff = ">=0.1"
httpx = ">=0.25"

[environments]
default = { features = ["dev"], solve-group = "default" }

# ── Tasks ────────────────────────────────────────────────────────────────────
[tasks]

fetch    = { cmd = "python scripts/fetch_sensors.py",          description = "Fetch stations, data latency, RSAM, alert, quakes, rivers, waveforms" }
validate = { cmd = "python scripts/validate_data.py",          description = "Check data/ JSON files are well-formed" }
test     = { cmd = "pytest tests/ -v",                         description = "Run test suite" }
lint     = { cmd = "ruff check scripts/",                      description = "Lint Python scripts" }
pipeline = { depends-on = ["fetch", "validate"],               description = "Run full data pipeline" }
open     = { cmd = "python -m http.server 8080",               description = "Serve dashboard at localhost:8080" }